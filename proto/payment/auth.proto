
syntax = "proto3";

package payment.v1;

option go_package = "github.com/kev-2544/go-payment-backend/gen/payment";

service AuthService {
    rpc Signup(SignupRequest) returns (SignupResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
}

message SignupRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message SignupResponse {
    string user_id = 1;
    string name = 2;
    string email = 3;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string user_id = 1;
    string access_token = 2;
}
